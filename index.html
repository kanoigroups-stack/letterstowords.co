    <!-- SEO: Structured Data (helps Google show rich results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Letters to Words",
          "url": "https://www.letterstowords.co",
          "description": "Free online word unscrambler, Scrabble word finder, anagram solver, and Wordle helper tool.",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.letterstowords.co/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "SoftwareApplication",
          "name": "Letters to Words - Word Unscrambler",
          "applicationCategory": "GameApplication",
          "operatingSystem": "Any",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          },
          "aggregateRating": {
            "@type": "AggregateRating",
            "ratingValue": "4.8",
            "ratingCount": "1250"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How does the Word Unscrambler tool work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Our free word unscrambler solves complex letters in milliseconds. By typing your mixed letter rack into the prompt, the backend algorithm analyzes the letters and cross-references them against premium official tournament dictionary databases (NWL, CSW, ENABLE) to find every valid combination grouped by word length."
              }
            },
            {
              "@type": "Question",
              "name": "Can I use blank tiles or wildcard letters?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, absolutely! If you are playing games with blank tiles, you can represent them using a question mark (?) or asterisk (*). The Letters to Words engine will dynamically calculate all possible alphabetic substitutions to output high-scoring word combinations."
              }
            },
            {
              "@type": "Question",
              "name": "Is this tool compliant with Scrabble and Words with Friends?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, our unscramble tool provides exact Scrabble word point counts based on standard layouts. You can select NWL (North American Scrabble), CSW (Collins/Global Scrabble), or ENABLE (ideal for Words With Friends) dictionaries."
              }
            },
            {
              "@type": "Question",
              "name": "How do I lock words to start or end with a letter?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "By using our Advanced Options dropdown, you can set precise search constraints. Simply enter desired letters into the Starts with, Ends with, or Must include form fields to find perfect word fits for open columns on your real game board."
              }
            }
          ]
        }
      ]
    }
    </script>
